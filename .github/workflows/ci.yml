name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - Frontend
          - Backend
          - ExpertStudy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ matrix.package }}
        run: pnpm run build
